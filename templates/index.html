<!DOCTYPE html>
<html>
<head>
    <title>Billing App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h1 class="mb-4">Billing Application</h1>

<form action="/add" method="POST" class="mb-4">

    <input type="text" name="customer_name" placeholder="Customer Name" class="form-control mb-2" required>

    <input type="text" name="product_name" placeholder="Product Name" class="form-control mb-2" required>

    <input type="number" name="quantity" placeholder="Quantity" class="form-control mb-2" required>

    <input type="number" step="0.01" name="price" placeholder="Price" class="form-control mb-2" required>

    <button class="btn btn-primary">Generate Bill</button>
</form>

<table class="table table-bordered">
    <tr>
        <th>ID</th>
        <th>Customer</th>
        <th>Product</th>
        <th>Quantity</th>
        <th>Price</th>
        <th>Total</th>
    </tr>

    {% for bill in bills %}
    <tr>
        <td>{{ bill.id }}</td>
        <td>{{ bill.customer_name }}</td>
        <td>{{ bill.product_name }}</td>
        <td>{{ bill.quantity }}</td>
        <td>{{ bill.price }}</td>
        <td>{{ bill.total }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
